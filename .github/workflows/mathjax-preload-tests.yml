# Test branch only (not part of the pull request): runs the src_mjx_preload tests
# in Chromium, Firefox and WebKit, with Quarto, real MathJax 4.1.3 and, as an
# external test fixture, CTM's MathJax adaptor (fetched, hash-checked, not stored here).
name: MathJax pre-loader tests

on:
  push:
    branches:
      - ci/2026-10-mathjax-preload-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: 62235ae386da9ce591d956caae3b54aa7da9785d
          path: .ctm-libs
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Quarto 1.8.27
        run: |
          mkdir -p "$RUNNER_TEMP/quarto"
          curl -fsSL -o "$RUNNER_TEMP/quarto.tgz" https://github.com/quarto-dev/quarto-cli/releases/download/v1.8.27/quarto-1.8.27-linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/quarto.tgz" -C "$RUNNER_TEMP/quarto" --strip-components=1
          "$RUNNER_TEMP/quarto/bin/quarto" --version
      - name: Install Playwright and MathJax
        run: |
          mkdir -p "$RUNNER_TEMP/deps"
          cd "$RUNNER_TEMP/deps"
          npm init -y > /dev/null
          npm install --ignore-scripts playwright@1.55.1 mathjax@4.1.3
      - name: Run the tests
        env:
          QUARTO: ${{ runner.temp }}/quarto/bin/quarto
          JXG_TEST_PLAYWRIGHT: ${{ runner.temp }}/deps/node_modules/playwright/index.mjs
          MATHJAX_DIR: ${{ runner.temp }}/deps/node_modules/mathjax
          CTM_OPAQUE_ADAPTOR: ${{ github.workspace }}/.ctm-libs/_extensions/ctm-libs/runtime/mathjax-opaque-adaptor.js
          JXG_TEST_BROWSERS: ${{ matrix.browser }}
        run: node --test --test-reporter=spec tests/*.test.mjs
